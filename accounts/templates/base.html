{% load static %}

<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Leads Center
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- Your CSS -->
    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
      <!-- Navbar CSS -->
<link rel="stylesheet"
          href="{% static 'css/navbar.css' %}">
      <!-- Hero CSS -->
    <link rel="stylesheet"
          href="{% static 'css/hero.css' %}">
      <!-- program CSS -->
    <link rel="stylesheet"
          href="{% static 'css/program.css' %}">
       <!-- aboutsection CSS -->
    <link rel="stylesheet"
          href="{% static 'css/aboutsection.css' %}">
  <!-- whychooseus CSS -->
    <link rel="stylesheet"
          href="{% static 'css/whychooseus.css' %}">

  <!-- Achievements CSS -->
    <link rel="stylesheet"
          href="{% static 'css/achievements.css' %}">
 <!-- campuslife CSS -->
    <link rel="stylesheet"
          href="{% static 'css/campuslife.css' %}">
    <!-- testimonials CSS -->
    <link rel="stylesheet"
          href="{% static 'css/testimonials.css' %}">
 <!-- CTA CSS -->
    <link rel="stylesheet"
          href="{% static 'css/cta.css' %}">

 <!-- Contact CSS -->
    <link rel="stylesheet"
          href="{% static 'css/contact.css' %}">

 <!-- Contact principal -->
    <link rel="stylesheet"
          href="{% static 'css/principal.css' %}">

 <!-- CA Program -->
    <link rel="stylesheet"
          href="{% static 'css/caprogram.css' %}">
 <!-- ACCA Program -->
    <link rel="stylesheet"
          href="{% static 'css/accaprogram.css' %}">
 <!-- Achivement Program -->
    <link rel="stylesheet"
          href="{% static 'css/achievement.css' %}">


    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- Navbar -->




    <!-- Page Content -->

    {% block content %}
    {% endblock %}


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>


<script src="{% static 'js/achievement.js' %}"></script>
    <script src="{% static 'js/accprogram.js' %}"></script>
    {% block extra_js %}
    {% endblock %}

</body>

</html>
